name: Board summary refresh
on:
  push:
    branches: [main]
    paths: ["docs/07-kanban.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: board-summary-refresh
  cancel-in-progress: false
jobs:
  refresh:
    # Loop guard: skip our own bot commits and anything marked [skip ci].
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate board summary
        run: python tools/board_summary.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/07-kanban.md; then
            echo "Board summary already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/07-kanban.md
          git commit -m "Board summary refresh [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
