name: Build generated Roblox place
on:
  push:
    branches: [main, redesign/resources-and-core-fixes]
    paths: ["src/**", "resources/**", "default.project.json", "tools/**", "tests/**", ".github/workflows/build-generated-place.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the kanban merge check needs the merge base and main's row history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail on leftover merge conflict markers (CRLF safe; BD-999, docs/166)
        run: python tools/verify_no_conflict_markers.py
      - name: Install test dependencies
        run: python -m pip install Pillow numpy
      - name: Verify doc numbers and BD ids are unique
        run: python tools/verify_doc_ids.py
      - name: BD-004 release id slot is well formed (empty is allowed until the owner answers; docs/148)
        run: python tools/verify_release_ids.py
      - name: Handbook checks (docs/114 UI floors, sound cap, palette, PR template; BD-408)
        run: python tools/verify_handbook.py
      - name: Kid text lint, baseline mode (fails only on NEW hard-to-read player text; BD-655, docs/162)
        run: python tools/lint_kid_text.py --baseline
      - name: Kanban merge safety (duplicate BD ids, stale rows put back; PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python tools/verify_kanban_merge.py --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Board counts (job summary only; the kanban stores no counts)
        run: python tools/board_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Verify image bindings
        run: python tools/bind_artwork.py --check
      - name: Install pinned Luau tools
        run: |
          curl --fail --location https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip --output /tmp/luau.zip
          unzip /tmp/luau.zip -d /tmp/luau
      - name: Check Luau sources and behavior
        run: |
          python tools/bind_ui_icons.py --check
          python tools/bind_visual_assets.py --check
          python tools/bind_products.py --check
          python tools/verify_robux_line.py --selftest
          python tools/bind_worldkit_meshes.py --check
          python tools/verify_asset_slots.py
          python tools/verify_sources.py --compiler /tmp/luau/luau-compile
          python tools/verify_local_budget.py --ast /tmp/luau/luau-ast --compiler /tmp/luau/luau-compile
          python tools/verify_local_budget.py --ast /tmp/luau/luau-ast --compiler /tmp/luau/luau-compile --selftest
          python tools/verify_luau.py --runner /tmp/luau/luau
          python tools/verify_world_art.py --runner /tmp/luau/luau
          python tools/verify_gameplay.py --runner /tmp/luau/luau
          python tools/verify_movement_mobile.py --runner /tmp/luau/luau
          python tools/verify_movement_speed.py --runner /tmp/luau/luau
          python tools/verify_identity.py --runner /tmp/luau/luau
          python tools/verify_fusion.py --runner /tmp/luau/luau
          python tools/verify_cosmetic_ownership.py --runner /tmp/luau/luau
          python tools/simulate_fusion_ladder.py --check
          python tools/verify_fusion_ui.py --runner /tmp/luau/luau
          python tools/verify_next_goal.py --runner /tmp/luau/luau
          python tools/verify_goals.py --runner /tmp/luau/luau
          python tools/verify_objectives.py --runner /tmp/luau/luau
          python tools/verify_objective_hooks.py --runner /tmp/luau/luau
          python tools/verify_objectives_panel.py --runner /tmp/luau/luau
          python tools/verify_qa_kit.py --runner /tmp/luau/luau
          python tools/verify_demo_director.py --runner /tmp/luau/luau
          python tools/demo/record.py --selftest
          if command -v ffmpeg >/dev/null; then python tools/demo/edit.py selftest; else echo "ffmpeg not installed: edit.py selftest skipped"; fi
          python tools/verify_discovery.py --runner /tmp/luau/luau
          python tools/verify_admin.py --runner /tmp/luau/luau
          python tools/verify_notify.py --runner /tmp/luau/luau
          python tools/verify_audio.py --runner /tmp/luau/luau
          python tools/verify_sound_lab.py
          python tools/verify_hatch_sequence.py --runner /tmp/luau/luau
          python tools/verify_egg_toast_count.py --runner /tmp/luau/luau
          python tools/verify_rare_hatch.py --runner /tmp/luau/luau
          python tools/verify_inspect.py --runner /tmp/luau/luau
          python tools/verify_eggs_screen.py --runner /tmp/luau/luau
          python tools/verify_close_paths.py --runner /tmp/luau/luau
          python tools/verify_egg_origin.py --runner /tmp/luau/luau
          python tools/verify_load_gate.py --runner /tmp/luau/luau
          python tools/verify_surface_maps.py
          python tools/verify_mesh_sanity.py --runner /tmp/luau/luau
          python tools/verify_dino_motion.py --runner /tmp/luau/luau
          python tools/verify_hub_scale.py --runner /tmp/luau/luau
          python tools/verify_lowpoly_dinos.py --runner /tmp/luau/luau
          python tools/verify_lowpoly_views.py --runner /tmp/luau/luau
          python tools/verify_motion_poses.py --runner /tmp/luau/luau --selftest
          python tools/verify_world_budget.py --runner /tmp/luau/luau
          python tools/qa/phone_forecast.py --runner /tmp/luau/luau --check
          python tools/verify_phone_guards.py --runner /tmp/luau/luau
          python tools/verify_world_overlap.py --runner /tmp/luau/luau
          python tools/verify_world_props.py --runner /tmp/luau/luau
          python tools/verify_vegetation_layers.py --runner /tmp/luau/luau
          python tools/verify_layer_stats.py --runner /tmp/luau/luau
          python tools/verify_world_layer.py --runner /tmp/luau/luau
          python tools/verify_colossal_lod.py --runner /tmp/luau/luau
          python tools/verify_scale_ladder.py --runner /tmp/luau/luau
          python tools/verify_cave_overlap.py --runner /tmp/luau/luau
          python tools/verify_cave_terrain.py --runner /tmp/luau/luau
          python tools/verify_cave_lighting.py --runner /tmp/luau/luau
          python tools/verify_hub_travel_client.py --runner /tmp/luau/luau
          # cave and hub
          python tools/verify_cave_gate.py --runner /tmp/luau/luau
          python tools/verify_streaming_teleports.py --runner /tmp/luau/luau
          python tools/verify_cave_hub.py --runner /tmp/luau/luau
          python tools/verify_cave_lava.py --runner /tmp/luau/luau
          python tools/verify_cave_weather.py
          python tools/verify_hub_travel.py --runner /tmp/luau/luau
          python tools/verify_hub_walk_there.py --runner /tmp/luau/luau
          python tools/verify_spawn.py --runner /tmp/luau/luau
          # combat
          python tools/verify_combat_service.py --runner /tmp/luau/luau
          python tools/verify_combat_state.py --runner /tmp/luau/luau
          python tools/verify_combat_stats.py --runner /tmp/luau/luau
          python tools/verify_combat_teamup.py --runner /tmp/luau/luau
          python tools/verify_npc_predators.py --runner /tmp/luau/luau
          python tools/verify_hit_sizes.py --runner /tmp/luau/luau
          python tools/verify_hit_zone.py --runner /tmp/luau/luau
          # first-time player
          python tools/verify_ftue_copy.py --runner /tmp/luau/luau
          python tools/verify_ftue_p1.py --runner /tmp/luau/luau
          python tools/verify_ftue_rules.py --runner /tmp/luau/luau
          python tools/verify_safe_eggs_line.py --runner /tmp/luau/luau
          # hatch and mutation reveal
          python tools/verify_hatch.py --runner /tmp/luau/luau
          python tools/verify_hatch_fx.py --runner /tmp/luau/luau
          python tools/verify_hatch_v2.py --runner /tmp/luau/luau
          python tools/verify_mutation_reveal.py --runner /tmp/luau/luau
          python tools/verify_fx_anime.py --runner /tmp/luau/luau
          python tools/verify_fx_moments.py --runner /tmp/luau/luau
          # HUD, settings, shop and text
          python tools/verify_hud.py --runner /tmp/luau/luau
          python tools/verify_settings.py --runner /tmp/luau/luau
          python tools/verify_shop_crystals.py --runner /tmp/luau/luau
          python tools/verify_shop_preview.py --runner /tmp/luau/luau
          python tools/verify_text_style.py --runner /tmp/luau/luau
          python tools/verify_phone_scale.py --runner /tmp/luau/luau
          python tools/verify_owner_feedback_p1.py --runner /tmp/luau/luau
          # world and art
          python tools/verify_camera_occlusion.py --runner /tmp/luau/luau
          python tools/verify_camera_framing.py --runner /tmp/luau/luau
          python tools/verify_mouth_reach.py --runner /tmp/luau/luau
          python tools/verify_lowpoly_budget.py --runner /tmp/luau/luau
          python tools/verify_lowpoly_patterns.py --runner /tmp/luau/luau
          python tools/verify_pattern_atlas.py --runner /tmp/luau/luau
          python tools/verify_fx_textures.py
          python tools/verify_equip_visual.py
          # other rules
          python tools/verify_classes.py --runner /tmp/luau/luau
          python tools/verify_colour_bonus.py --runner /tmp/luau/luau
          python tools/verify_rarity.py --runner /tmp/luau/luau
          python tools/verify_patterns.py --runner /tmp/luau/luau
          python tools/verify_gene_boost.py --runner /tmp/luau/luau
          python tools/verify_pattern_colour_index.py --runner /tmp/luau/luau
          python tools/verify_modal_blur.py --runner /tmp/luau/luau
          python tools/qa/palette_report.py --runner /tmp/luau/luau
          python tools/qa/ground_report.py
          python tools/qa/budget_report.py
          python tools/fx_budget_report.py --runner /tmp/luau/luau
          python tools/measure_identity_storage.py --check
          python tools/verify_progression.py --runner /tmp/luau/luau
          python tools/verify_potion_shop.py --runner /tmp/luau/luau
          python tools/verify_potion_purchase.py --runner /tmp/luau/luau
          python tools/verify_ui_format.py --runner /tmp/luau/luau
          python tools/verify_weather.py --runner /tmp/luau/luau
          python tools/verify_env_polish.py --runner /tmp/luau/luau
          python tools/verify_eggs.py --runner /tmp/luau/luau
          python tools/verify_rewards.py --runner /tmp/luau/luau
          python tools/verify_rollback.py --runner /tmp/luau/luau
          python tools/verify_profile_golden.py --runner /tmp/luau/luau
          python tools/verify_server_module_size.py
          python tools/verify_server_module_size.py --selftest
          python tools/verify_gifts.py --runner /tmp/luau/luau
          python tools/verify_gift_ui.py --runner /tmp/luau/luau
          python tools/verify_switch_on.py
          python tools/verify_skins.py --runner /tmp/luau/luau
          python tools/verify_nests.py --runner /tmp/luau/luau
          python tools/verify_mutations.py --runner /tmp/luau/luau
          python tools/verify_mutation_look.py --runner /tmp/luau/luau
          python tools/verify_mutation_badges.py
          python tools/verify_trail_icons.py
          python tools/verify_shop_tiles.py --runner /tmp/luau/luau
          python tools/verify_paid_random_gate.py --runner /tmp/luau/luau
          python tools/verify_secret_species.py --runner /tmp/luau/luau
          python tools/verify_catalog.py --runner /tmp/luau/luau
          python tools/verify_fx.py --runner /tmp/luau/luau
          python tools/verify_creature_genes.py --runner /tmp/luau/luau
          python tools/verify_visual_growth.py --runner /tmp/luau/luau
          python tools/verify_outcomes.py --runner /tmp/luau/luau
          python tools/verify_odds_copy.py --runner /tmp/luau/luau
          python tools/verify_previews.py --runner /tmp/luau/luau
          python tools/verify_artwork.py --runner /tmp/luau/luau
          python tools/verify_load.py --runner /tmp/luau/luau
          python tools/verify_regression_walk.py --runner /tmp/luau/luau
          python tools/verify_multiplayer_sim.py --runner /tmp/luau/luau
          python tools/verify_session1_smoke.py --runner /tmp/luau/luau
          python tools/verify_private_state.py --runner /tmp/luau/luau
          python tools/verify_run_end_eggs.py --runner /tmp/luau/luau
          python tools/verify_class_movement.py --runner /tmp/luau/luau
          python tools/verify_class_picker.py --runner /tmp/luau/luau
          python tools/verify_server_scaling.py --runner /tmp/luau/luau
          python tools/verify_telemetry.py --runner /tmp/luau/luau
          python tools/verify_feedback.py --runner /tmp/luau/luau
          python tools/verify_remote_fuzz.py --runner /tmp/luau/luau
          python tools/verify_remote_fuzz.py --runner /tmp/luau/luau --selftest
          python tools/verify_predation_tick.py --runner /tmp/luau/luau
          python tools/verify_predation_tick.py --runner /tmp/luau/luau --selftest
          python tools/generate_sfx.py --check
      - name: Build place
        run: |
          python tools/build.py
          python tools/verify_release.py --profile default
          python -c 'import os,re,pathlib; v=re.search(r"Build = \"redesign-(\d+)\"",pathlib.Path("src/shared/Config.luau").read_text()).group(1); open(os.environ["GITHUB_ENV"],"a").write("BE_DINO_BUILD=BeDino-Build"+v+"\n")'
      - name: Run packaging and artwork tests
        env:
          LUAU_RUNNER: /tmp/luau/luau
        run: python -m unittest discover -s tests -v
      - name: Upload current Roblox build
        uses: actions/upload-artifact@v4
        with:
          name: BeDino-current-build
          path: |
            build/${{ env.BE_DINO_BUILD }}.rbxlx
            build/${{ env.BE_DINO_BUILD }}.manifest.json
          if-no-files-found: error
      - name: Build playtest place (once BD-004 IDs are recorded)
        run: |
          if grep -Eq '^    PlaytestPlaceId = [1-9][0-9]*,' src/shared/Config.luau; then
            python tools/build.py --profile playtest
            python tools/verify_release.py --profile playtest --place "build/${BE_DINO_BUILD}-playtest.rbxlx"
            python tools/verify_load.py --runner /tmp/luau/luau --gate-playtest
          else
            echo "PlaytestPlaceId not recorded yet (BD-004); playtest place not built."
          fi
      - name: Upload playtest build
        uses: actions/upload-artifact@v4
        with:
          name: BeDino-playtest-build
          path: |
            build/${{ env.BE_DINO_BUILD }}-playtest.rbxlx
            build/${{ env.BE_DINO_BUILD }}-playtest.manifest.json
          if-no-files-found: ignore
